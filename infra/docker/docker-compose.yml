services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    image: ${IMAGE:-goalyst-web:local}
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - ${ENV_FILE:-../../apps/web/.env.local}
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: Alpine resolves "localhost" to ::1 (IPv6) first,
      # and the server only listens on IPv4 — wget to "localhost" gets refused
      # even though the server is up and 127.0.0.1 reaches it fine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
