services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    image: ${IMAGE:-goalyst-web:local}
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - ${ENV_FILE:-../../apps/web/.env.local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
